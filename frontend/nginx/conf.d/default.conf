# 统一入口 nginx:直接服务前端静态文件,并将 /api 反代到 compose 内的 backend 服务。
# 说明:不再依赖 host.docker.internal(仅 Docker Desktop 可用),统一走 compose 服务 DNS。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 知识库上传后端限制 20MB,这里放宽到 25m(默认 1m 会导致生产 413)
  client_max_body_size 25m;

  # SPA history 路由 fallback:刷新 /agent、/template 等不再 404
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 后端 API(含 SSE 流式 /api/chat)
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE streaming support
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # FastAPI 自动文档(开发调试用)
  location /docs {
    proxy_pass http://backend:8000/docs;
    proxy_set_header Host $host;
  }

  location /redoc {
    proxy_pass http://backend:8000/redoc;
    proxy_set_header Host $host;
  }

  location /openapi.json {
    proxy_pass http://backend:8000/openapi.json;
    proxy_set_header Host $host;
  }
}

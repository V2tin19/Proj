server {
  listen 80;

  # 前端静态页面
  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # 后端 API 代理到外部 FastAPI 服务
  # 默认指向本机 8000 端口（后端 docker run 时映射的端口）
  # 如果后端部署在其他机器，修改下面的地址即可
  location /api/ {
    proxy_pass http://host.docker.internal:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # FastAPI 自动文档（开发调试用）
  location /docs {
    proxy_pass http://host.docker.internal:8000/docs;
    proxy_set_header Host $host;
  }

  location /redoc {
    proxy_pass http://host.docker.internal:8000/redoc;
    proxy_set_header Host $host;
  }

  location /openapi.json {
    proxy_pass http://host.docker.internal:8000/openapi.json;
    proxy_set_header Host $host;
  }
}


services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: proj_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # 知识库数据持久化（避免容器重启后丢失）
      - backend_data:/app/data
    expose:
      - "8000"
    networks:
      - proj_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: proj_web
    restart: unless-stopped
    networks:
      - proj_net
    # 注意：web 不直接暴露端口，由 nginx 统一出口
    expose:
      - "80"

  nginx:
    image: nginx:stable-alpine
    container_name: proj_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - web
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - proj_net

volumes:
  backend_data:

networks:
  proj_net:
    driver: bridge

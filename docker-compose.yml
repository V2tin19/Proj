
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: proj_web
    restart: unless-stopped
    networks:
      - proj_net
    expose:
      - "80"

  nginx:
    image: nginx:stable-alpine
    container_name: proj_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - proj_net

networks:
  proj_net:
    driver: bridge

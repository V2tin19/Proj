[package]
name = "ai-resume-app"
version = "1.0.0"
description = "AI 简历生成器桌面客户端"
authors = ["AI Resume Team"]
edition = "2021"

[lib]
name = "ai_resume_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
